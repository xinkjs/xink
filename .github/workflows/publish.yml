name: Stage Packages

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Release commit SHA; use the same SHA for every package in this release
        required: true
        type: string
  pull_request:
    types:
      - closed
    branches:
      - main

concurrency:
  group: npm-staged-publishing
  cancel-in-progress: false

jobs:
  stage:
    name: Stage Packages
    environment: npm
    # changesets/action creates this branch for the release PR. Checking the
    # merged PR avoids depending on a particular merge commit message.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'changeset-release/main' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || inputs.release_sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@xinkjs"
          package-manager-cache: false

      - name: Install npm with staged publishing support
        run: npm install --global npm@11

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Packages
        run: bun run build

      - name: Pack Unpublished Packages
        run: bunx changeset pack --out-dir .release

      - name: Stage Packages on npm
        run: bun .github/scripts/stage-packages.ts .release/publish-plan.json

      - name: Record Release Commit
        run: |
          RELEASE_SHA=$(git rev-parse HEAD)
          echo "## Staged release commit" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$RELEASE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Approve the staged package on npm, then rerun this workflow with the same SHA to stage the next package." >> "$GITHUB_STEP_SUMMARY"
          echo "After all packages are approved, run **Finalize Release** with this commit SHA." >> "$GITHUB_STEP_SUMMARY"
